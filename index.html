<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משימה חדשה · Smart Todos</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: var(--space-0);
      background: var(--color-page);
      color: var(--color-text);
      font-family: Arial, "Rubik", sans-serif;
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      place-items: center;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .page-shell {
      display: grid;
      width: 100%;
      min-height: 100vh;
      padding: var(--space-4);
      place-items: center;
    }

    .secondary-button,
    .primary-button,
    .importance-option,
    .more-toggle {
      border: var(--size-border) solid var(--color-transparent);
      cursor: pointer;
    }

    .primary-button {
      display: inline-flex;
      min-height: var(--size-button-height);
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-small);
      background: var(--color-primary);
      color: var(--color-surface);
      font-weight: 700;
    }

    .primary-button:hover {
      background: var(--color-primary-hover);
    }

    .importance-option:focus-visible,
    .more-toggle:focus-visible,
    .primary-button:focus-visible,
    .secondary-button:focus-visible,
    .close-button:focus-visible {
      outline: var(--size-border) solid var(--color-primary);
      outline-offset: var(--space-1);
    }

    .overlay {
      position: fixed;
      z-index: 2;
      display: grid;
      overflow-y: auto;
      padding: var(--space-6);
      background: var(--color-backdrop);
      inset: var(--space-0);
      place-items: center;
    }

    .overlay[hidden] {
      display: none;
    }

    .modal {
      width: min(100%, var(--size-modal-max));
      max-height: calc(100vh - var(--space-12));
      overflow-y: auto;
      border: var(--size-border) solid var(--color-border);
      border-radius: var(--radius-large);
      background: var(--color-surface);
      box-shadow: var(--shadow-modal);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      border-bottom: var(--size-border) solid var(--color-border);
    }

    .modal-title {
      margin: var(--space-0);
      font-size: var(--font-size-title);
      font-weight: 700;
    }

    .close-button {
      width: var(--size-icon);
      height: var(--size-icon);
      padding: var(--space-0);
      border: var(--size-border) solid var(--color-transparent);
      background: var(--color-transparent);
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: var(--font-size-title);
      line-height: 1;
    }

    .modal-body {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-6);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }

    .field {
      display: grid;
      min-width: var(--space-0);
      gap: var(--space-2);
    }

    .importance-field {
      min-inline-size: var(--space-0);
      margin: var(--space-0);
      padding: var(--space-0);
      border: var(--space-0) solid var(--color-transparent);
    }

    .field-label {
      color: var(--color-text);
      font-size: var(--font-size-body);
      font-weight: 700;
    }

    .required {
      color: var(--color-danger);
    }

    .field-control {
      width: 100%;
      min-height: var(--size-field-height);
      padding: var(--space-3);
      border: var(--size-border) solid var(--color-border-strong);
      border-radius: var(--radius-small);
      outline: none;
      background: var(--color-surface);
      color: var(--color-text);
      text-align: right;
    }

    .field-control::placeholder {
      color: var(--color-text-subtle);
    }

    .field-control:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 var(--size-border) var(--color-primary);
    }

    .field-hint {
      color: var(--color-text-muted);
      font-size: var(--font-size-small);
    }

    .title-counter {
      color: var(--color-text-subtle);
      font-size: var(--font-size-small);
      font-weight: 400;
    }

    .importance-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-2);
    }

    .importance-option {
      min-height: var(--size-field-height);
      padding: var(--space-2);
      border-color: var(--color-border);
      border-radius: var(--radius-small);
      background: var(--color-surface);
      color: var(--color-text-muted);
    }

    .importance-option[aria-checked="true"] {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-weight: 700;
    }

    .priority-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4);
      border: var(--size-border) solid var(--color-border);
      border-radius: var(--radius-medium);
      background: var(--color-surface-muted);
    }

    .priority-icon {
      display: grid;
      width: var(--size-priority-icon);
      height: var(--size-priority-icon);
      flex: 0 0 var(--size-priority-icon);
      place-items: center;
      border-radius: var(--radius-small);
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: var(--font-size-icon);
    }

    .priority-copy {
      flex: 1;
      min-width: var(--space-0);
    }

    .priority-title {
      margin: var(--space-0);
      font-weight: 700;
    }

    .priority-description {
      margin: var(--space-1) var(--space-0) var(--space-0);
      color: var(--color-text-muted);
      font-size: var(--font-size-small);
    }

    .priority-score {
      color: var(--color-primary);
      font-size: var(--font-size-score);
      font-weight: 700;
      line-height: 1;
    }

    .priority-score small {
      color: var(--color-text-muted);
      font-size: var(--font-size-small);
      font-weight: 400;
    }

    .more-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-0);
      background: var(--color-transparent);
      color: var(--color-primary);
      font-weight: 700;
      justify-self: start;
    }

    .more-toggle:hover {
      color: var(--color-primary-hover);
    }

    .chevron {
      display: inline-block;
      transition: transform 160ms ease;
    }

    .more-toggle[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .extra-fields {
      display: grid;
      gap: var(--space-4);
      padding-top: var(--space-1);
    }

    .extra-fields[hidden] {
      display: none;
    }

    .description-control {
      min-height: var(--size-textarea-min-height);
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-6);
      border-top: var(--size-border) solid var(--color-border);
    }

    .keyboard-hint {
      color: var(--color-text-muted);
      font-size: var(--font-size-small);
    }

    kbd {
      padding: var(--space-1) var(--space-2);
      border: var(--size-border) solid var(--color-border);
      border-radius: var(--radius-small);
      background: var(--color-surface-muted);
      color: var(--color-text);
      font: inherit;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .secondary-button {
      min-height: var(--size-button-height);
      padding: var(--space-2) var(--space-4);
      border-color: var(--color-border);
      border-radius: var(--radius-small);
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 700;
    }

    .secondary-button:hover {
      background: var(--color-surface-muted);
    }

    .toast {
      position: fixed;
      z-index: 3;
      right: 50%;
      bottom: var(--space-6);
      padding: var(--space-3) var(--space-5);
      transform: translateX(50%);
      border-radius: var(--radius-small);
      background: var(--color-primary);
      color: var(--color-surface);
      box-shadow: var(--shadow-modal);
    }

    .toast[hidden] {
      display: none;
    }

    .visually-hidden {
      position: absolute;
      overflow: hidden;
      width: var(--size-border);
      height: var(--size-border);
      padding: var(--space-0);
      border: var(--space-0);
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 760px) {
      .overlay {
        padding: var(--space-3);
      }

      .modal {
        max-height: calc(100vh - var(--space-6));
      }

      .modal-header,
      .modal-body,
      .modal-footer {
        padding: var(--space-4);
      }

      .modal-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {
      .field-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .importance-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <button class="primary-button" id="open-modal" type="button" aria-haspopup="dialog" aria-controls="task-dialog" aria-expanded="true"><span aria-hidden="true">＋</span> משימה חדשה</button>
  </main>

  <div class="overlay" id="overlay">
    <section class="modal" id="task-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="keyboard-hint">
      <header class="modal-header">
        <h2 class="modal-title" id="modal-title">משימה חדשה</h2>
        <button class="close-button" id="close-modal" type="button" aria-label="סגירה">×</button>
      </header>

      <form id="task-form">
        <div class="modal-body">
          <div class="field">
            <label class="field-label" for="task-title">כותרת <span class="required" aria-hidden="true">*</span><span class="visually-hidden"> (שדה חובה)</span></label>
            <input class="field-control" id="task-title" name="title" type="text" maxlength="120" placeholder="למשל, להכין מצגת לפגישה" required autofocus aria-describedby="title-counter">
            <div class="title-counter" id="title-counter" aria-live="polite">0 / 120 תווים</div>
          </div>

          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="due-date">מועד יעד</label>
              <input class="field-control" id="due-date" name="dueDate" type="date">
            </div>
            <div class="field">
              <label class="field-label" for="estimate">הערכת זמן</label>
              <div>
                <input class="field-control" id="estimate" name="estimate" type="number" min="1" placeholder="למשל, 60" aria-describedby="estimate-hint">
                <span class="field-hint" id="estimate-hint">בדקות</span>
              </div>
            </div>
          </div>

          <fieldset class="field importance-field">
            <legend class="field-label">חשיבות</legend>
            <div class="importance-options" role="radiogroup" aria-label="חשיבות המשימה">
              <button class="importance-option" type="button" role="radio" aria-checked="false" data-importance="low">נמוכה</button>
              <button class="importance-option" type="button" role="radio" aria-checked="false" data-importance="normal">רגילה</button>
              <button class="importance-option" type="button" role="radio" aria-checked="true" data-importance="high">גבוהה</button>
              <button class="importance-option" type="button" role="radio" aria-checked="false" data-importance="urgent">דחופה</button>
            </div>
          </fieldset>

          <section class="priority-card" aria-label="ציון עדיפות צפוי">
            <span class="priority-icon" aria-hidden="true">✦</span>
            <div class="priority-copy">
              <p class="priority-title">ציון עדיפות צפוי</p>
              <p class="priority-description" id="priority-description">לפי רמת החשיבות שבחרת</p>
            </div>
            <div class="priority-score"><span id="priority-score">72</span><small> / 100</small></div>
          </section>

          <button class="more-toggle" id="more-toggle" type="button" aria-expanded="false" aria-controls="extra-fields">
            <span class="chevron" aria-hidden="true">⌄</span><span>עוד שדות</span>
          </button>
          <div class="extra-fields" id="extra-fields" hidden>
            <div class="field">
              <label class="field-label" for="tags">תגיות</label>
              <input class="field-control" id="tags" name="tags" type="text" placeholder="הפרידי בין תגיות בפסיק">
            </div>
            <div class="field">
              <label class="field-label" for="dependency">תלויה במשימה</label>
              <input class="field-control" id="dependency" name="dependency" type="text" placeholder="שם המשימה">
            </div>
            <div class="field">
              <label class="field-label" for="description">תיאור</label>
              <textarea class="field-control description-control" id="description" name="description" placeholder="הוסיפי פרטים שיעזרו לך להשלים את המשימה"></textarea>
            </div>
          </div>
        </div>

        <footer class="modal-footer">
          <div class="keyboard-hint" id="keyboard-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> לשמירה <span aria-hidden="true">·</span> <kbd>Esc</kbd> לסגירה</div>
          <div class="footer-actions">
            <button class="secondary-button" id="cancel-modal" type="button">ביטול</button>
            <button class="primary-button" type="submit"><span aria-hidden="true">✓</span> שמירה</button>
          </div>
        </footer>
      </form>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const overlay = document.getElementById("overlay");
    const form = document.getElementById("task-form");
    const titleInput = document.getElementById("task-title");
    const titleCounter = document.getElementById("title-counter");
    const extraFields = document.getElementById("extra-fields");
    const moreToggle = document.getElementById("more-toggle");
    const priorityScore = document.getElementById("priority-score");
    const priorityDescription = document.getElementById("priority-description");
    const toast = document.getElementById("toast");
    const openModalButton = document.getElementById("open-modal");
    let selectedImportance = "high";
    let previousFocus = null;

    const importanceScores = {
      low: { score: 30, label: "נמוכה" },
      normal: { score: 50, label: "רגילה" },
      high: { score: 72, label: "גבוהה" },
      urgent: { score: 92, label: "דחופה" }
    };

    function openModal() {
      previousFocus = document.activeElement;
      overlay.hidden = false;
      openModalButton.setAttribute("aria-expanded", "true");
      titleInput.focus();
    }

    function closeModal() {
      overlay.hidden = true;
      openModalButton.setAttribute("aria-expanded", "false");
      form.reset();
      selectedImportance = "high";
      updateImportance();
      extraFields.hidden = true;
      moreToggle.setAttribute("aria-expanded", "false");
      updateTitleCounter();
      if (previousFocus && typeof previousFocus.focus === "function") {
        previousFocus.focus();
      } else {
        openModalButton.focus();
      }
    }

    function updateImportance() {
      document.querySelectorAll(".importance-option").forEach((option) => {
        option.setAttribute("aria-checked", String(option.dataset.importance === selectedImportance));
      });
      const selected = importanceScores[selectedImportance];
      priorityScore.textContent = String(selected.score);
      priorityDescription.textContent = `לפי רמת החשיבות ${selected.label} שבחרת`;
    }

    function updateTitleCounter() {
      titleCounter.textContent = `${titleInput.value.length} / 120 תווים`;
    }

    function createTaskFromForm() {
      const formData = new FormData(form);
      const estimate = formData.get("estimate");
      return {
        title: String(formData.get("title") || "").trim(),
        dueDate: formData.get("dueDate") || null,
        estimatedMinutes: estimate ? Number(estimate) : null,
        importance: selectedImportance,
        priorityScore: importanceScores[selectedImportance].score,
        tags: String(formData.get("tags") || "")
          .split(",")
          .map((tag) => tag.trim())
          .filter(Boolean),
        dependency: String(formData.get("dependency") || "").trim() || null,
        description: String(formData.get("description") || "").trim()
      };
    }

    async function saveTask(task) {
      document.dispatchEvent(new CustomEvent("tasksubmit", { detail: task }));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;
      window.setTimeout(() => {
        toast.hidden = true;
      }, 3000);
    }

    document.getElementById("open-modal").addEventListener("click", openModal);
    document.getElementById("close-modal").addEventListener("click", closeModal);
    document.getElementById("cancel-modal").addEventListener("click", closeModal);

    moreToggle.addEventListener("click", () => {
      const isExpanded = moreToggle.getAttribute("aria-expanded") === "true";
      moreToggle.setAttribute("aria-expanded", String(!isExpanded));
      extraFields.hidden = isExpanded;
    });

    document.querySelectorAll(".importance-option").forEach((option) => {
      option.addEventListener("click", () => {
        selectedImportance = option.dataset.importance;
        updateImportance();
      });
    });

    document.querySelector(".importance-options").addEventListener("keydown", (event) => {
      const options = [...document.querySelectorAll(".importance-option")];
      const currentIndex = options.indexOf(document.activeElement);
      let nextIndex;

      if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
        nextIndex = (currentIndex + 1) % options.length;
      } else if (event.key === "ArrowRight" || event.key === "ArrowUp") {
        nextIndex = (currentIndex - 1 + options.length) % options.length;
      } else if (event.key === "Home") {
        nextIndex = 0;
      } else if (event.key === "End") {
        nextIndex = options.length - 1;
      } else {
        return;
      }

      event.preventDefault();
      options[nextIndex].focus();
      options[nextIndex].click();
    });

    titleInput.addEventListener("input", updateTitleCounter);

    document.addEventListener("keydown", (event) => {
      if (overlay.hidden) {
        return;
      }
      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
      } else if (event.key === "Enter" && event.ctrlKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!titleInput.value.trim()) {
        titleInput.setCustomValidity("נא למלא כותרת למשימה");
        titleInput.reportValidity();
        return;
      }
      titleInput.setCustomValidity("");

      const task = createTaskFromForm();
      try {
        await saveTask(task);
      } catch (error) {
        showToast("לא ניתן להשלים את המשימה. החלון נשאר פתוח.");
        return;
      }

      closeModal();
      showToast("המשימה נאספה בהצלחה. היא לא תישמר לאחר רענון.");
    });

    titleInput.addEventListener("input", () => titleInput.setCustomValidity(""));
    updateTitleCounter();
    updateImportance();
    titleInput.focus();
  </script>
</body>
</html>
