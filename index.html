<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כל המשימות · Smart Todos</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <!-- תוכלו להוסיף כאן קבצי CSS נוספים לפי הצורך -->
</head>
<body>
    <main class="page-shell" style="padding: 24px; font-family: system-ui, sans-serif;">
        <!-- כותרת ראשית וכפתור משימה חדשה -->
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="margin: 0; font-size: 24px; font-weight: bold;">כל המשימות</h1>
                <p style="margin: 4px 0 0; color: #666; font-size: 14px;">18 משימות פתוחות - ממוינות לפי ציון עדיפות</p>
            </div>
            <button class="primary-button" type="button" style="background-color: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                ＋ משימה חדשה
            </button>
        </header>

        <!-- סרגל כלים: חיפוש ומסננים -->
        <section style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
            <input type="search" placeholder="חיפוש בכותרת ובתיאור..." style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;">
            <select style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;"><option>סטטוס: פתוחות</option></select>
            <select style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;"><option>תגיות</option></select>
            <select style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;"><option>מועד יעד</option></select>
            <select style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;"><option>חיוויים</option></select>
            <select style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;"><option>מיון: ציון עדיפות</option></select>
        </section>

        <!-- טבלת משימות ראשית -->
        <section style="background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse; text-align: right;">
                <thead>
                    <tr style="background: #f9fafb; border-bottom: 1px solid #e5e7eb; font-size: 14px; color: #4b5563;">
                        <th style="padding: 12px;"><input type="checkbox"></th>
                        <th style="padding: 12px;">כותרת</th>
                        <th style="padding: 12px;">סטטוס</th>
                        <th style="padding: 12px;">מועד יעד</th>
                        <th style="padding: 12px;">חיוויים</th>
                        <th style="padding: 12px;">תגיות</th>
                    </tr>
                </thead>
                <tbody style="font-size: 14px;">
                    <tr style="border-bottom: 1px solid #f3f4f6;">
                        <td style="padding: 12px;"><input type="checkbox"></td>
                        <td style="padding: 12px; font-weight: 500;">תיקון באג בשימרית טופס ההרשמה</td>
                        <td style="padding: 12px;"><span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px;">לביצוע</span></td>
                        <td style="padding: 12px; color: #dc2626;">באיחור</td>
                        <td style="padding: 12px;">Frontend</td>
                        <td style="padding: 12px;">באג</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #f3f4f6;">
                        <td style="padding: 12px;"><input type="checkbox"></td>
                        <td style="padding: 12px; font-weight: 500;">סקירת קוד - עמוד הרשמה</td>
                        <td style="padding: 12px;"><span style="background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 4px; font-size: 12px;">במהלך</span></td>
                        <td style="padding: 12px;">מחר</td>
                        <td style="padding: 12px;">Code Review</td>
                        <td style="padding: 12px;">-</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
